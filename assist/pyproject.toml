[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brevio-core-assist"
version = "0.8.1"
description = "Optional plugin for brevio-core: explain a finding or suggest a fix with your own model endpoint and key. Off until configured; it asks before it sends."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Brevio"}]
dependencies = ["brevio-core==0.8.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://brevio.pro"
Source = "https://github.com/Brevio-Ventures/brevio-core"

[project.scripts]
brevio-core-assist = "brevio_core_assist.assist:main"

[tool.setuptools]
packages = ["brevio_core_assist"]
