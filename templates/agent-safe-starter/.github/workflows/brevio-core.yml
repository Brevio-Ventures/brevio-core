# From the agent-safe starter template: the workflow `brevio-core init` writes, pinned to brevio-core 0.6.0.
name: brevio-core
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  brevio-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: Brevio-Ventures/brevio-core@v0.6.0
        with:
          package-version: 0.6.0
