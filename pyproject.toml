[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brevio-core"
version = "0.1.0"
description = "A zero-token pull-request gate that catches the mistakes coding agents keep repeating."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Brevio"}]
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://brevio.pro"
Source = "https://github.com/Brevio-Ventures/brevio-core"
Issues = "https://github.com/Brevio-Ventures/brevio-core/issues"

[project.scripts]
brevio-core = "brevio.pipeline.core_cli:main"

[tool.setuptools.packages.find]
include = ["brevio*"]
