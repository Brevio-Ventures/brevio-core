name: Release
# Publishes to PyPI through trusted publishing (OIDC). No credential is stored in this repository.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag matches VERSION
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Tests
        run: python -m unittest discover -s tests/pipeline/core_export -t .
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: brevio-core-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
