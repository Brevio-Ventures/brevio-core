# The composite action at the root of the brevio-core repository (`uses: Brevio-Ventures/brevio-core@v0`). Its own CI runs it with
# `uses: ./`. The release stamps the version, the organisation and the rule count in, so
# `@vX.Y.Z` installs exactly brevio-core X.Y.Z (ROADMAP E26, 2026-11-05).
#
# It runs on pull_request, merge_group and push only and refuses every other event. The privileged events that hand
# a write token to a run on code from a fork are never supported: the scan reads the code under review, and that code
# must never run next to a write token (SECURITY-REVIEW.md). Third-party actions are pinned to full commit SHAs.
name: 'Brevio Gate'
description: 'Pull-request gate, no model call: 8 scanned rules as line patterns on the added lines, no secrets'
author: 'Brevio'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  base:
    description: 'Git ref or SHA the diff is taken against; empty: the pull request base, the merge group base, or the commit before the push'
    required: false
    default: ''
  fail-on:
    description: 'Which findings fail the check: new (not in .brevio/baseline.json), all, error (new error-level findings only; levels come from brevio-core.toml), or none (report only)'
    required: false
    default: 'new'
  comment:
    description: 'The pull request comment: on-findings (post or update it while there are findings, mark it resolved once they are gone), always, or never'
    required: false
    default: 'on-findings'
  footer:
    description: 'End the comment with "checked by brevio-core": auto (public repositories only), true, or false. false also leaves out the Teams line of the report'
    required: false
    default: 'auto'
  sarif:
    description: 'Upload the findings to GitHub code scanning when true (needs security-events: write)'
    required: false
    default: 'false'
  source:
    description: 'pip requirement or path to install instead of the PyPI release (the repository itself uses ".")'
    required: false
    default: ''
  package-version:
    description: 'brevio-core version to install; the default is the release of this Action, "latest" takes the newest'
    required: false
    default: '0.6.0'
outputs:
  status:
    description: 'pass or fail'
    value: ${{ steps.result.outputs.status }}
  findings:
    description: 'How many findings the scan reported (not counting silenced ones)'
    value: ${{ steps.report.outputs.findings }}
runs:
  using: 'composite'
  steps:
    - name: brevio-core / check the event
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        case "$EVENT" in
          pull_request|merge_group|push) ;;
          *) echo "::error title=brevio-core::brevio-core runs on pull_request, merge_group and push, not on $EVENT (see SECURITY-REVIEW.md)"
             exit 2 ;;
        esac
    - name: brevio-core / set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: brevio-core / install
      shell: bash
      env:
        PKG_VERSION: ${{ inputs.package-version }}
        PKG_SOURCE: ${{ inputs.source }}
      run: |
        if [ "$PKG_VERSION" = "latest" ]; then PKG_VERSION=""; fi
        pip install --quiet "${PKG_SOURCE:-brevio-core${PKG_VERSION:+==$PKG_VERSION}}"
    - name: brevio-core / scan
      id: scan
      shell: bash
      env:
        BASE_INPUT: ${{ inputs.base }}
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.base_ref }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        FAIL_ON: ${{ inputs.fail-on }}
        FOOTER: ${{ inputs.footer }}
      run: |
        base="$BASE_INPUT"
        if [ -z "$base" ]; then
          case "$EVENT" in
            pull_request) base="${PR_BASE:+origin/$PR_BASE}" ;;
            merge_group) base="$MERGE_GROUP_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
        fi
        # The first push of a branch has no commit before it (an all-zero SHA): compare with the default branch.
        if [ -z "${base//0/}" ]; then base="origin/${DEFAULT_BRANCH:-main}"; fi
        if ! git rev-parse --verify -q "$base^{commit}" > /dev/null; then
          echo "::error title=brevio-core::base $base is not in this checkout; use actions/checkout with fetch-depth: 0"
          exit 2
        fi
        rules_url="https://brevio-ventures.github.io/brevio-core/rules/"     # the rule pages on GitHub Pages (docs/, the Docs workflow); the CLI appends the ID
        # footer: false turns off every line of ours, the report's closing Teams line too (ROADMAP E37, 2026-11-05).
        quiet=""; if [ "$FOOTER" = "false" ]; then quiet="--no-upgrade-line"; fi
        out="$RUNNER_TEMP/brevio-core.md"
        err="$RUNNER_TEMP/brevio-core.err"
        brevio-core scan --diff "$base" --fail-on "$FAIL_ON" --format markdown --rules-url "$rules_url" $quiet \
          --sarif brevio-gate.sarif > "$out" 2> "$err" && rc=0 || rc=$?
        # The scan's own messages quote code under review: no line of them may act as a workflow command.
        stop="brevio-core-$(date +%s%N)"
        echo "::stop-commands::$stop"
        cat "$err" >&2
        echo "::$stop::"
        nothing=false
        if [ "$rc" -eq 0 ] && grep -q ' in 0 file(s)' "$err"; then nothing=true; fi
        { echo "rc=$rc"; echo "nothing=$nothing"; } >> "$GITHUB_OUTPUT"
    - name: brevio-core / summary and annotations
      id: report
      shell: python
      env:
        RC: ${{ steps.scan.outputs.rc }}
        NOTHING: ${{ steps.scan.outputs.nothing }}
        FOOTER: ${{ inputs.footer }}
        PRIVATE: ${{ github.event.repository.private }}
      run: |
        import json
        import os
        import re

        env = os.environ
        tmp = env["RUNNER_TEMP"]
        MARKER = "<!-- brevio-core -->"
        CAP = 10   # GitHub shows at most ten warning annotations per step; the summary lists every finding

        def read(path):
            try:
                with open(path, encoding="utf-8") as fh:
                    return fh.read()
            except OSError:
                return ""

        def esc(text, prop=False):
            text = str(text).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            return text.replace(":", "%3A").replace(",", "%2C") if prop else text

        def quiet_mentions(text):
            # Outside code spans an "@name" would notify that user or team; a zero-width space after the @ stops it.
            parts = text.split("`")
            parts[::2] = [re.sub(r"(?<![\w@])@(?=[A-Za-z0-9])", "@​", p) for p in parts[::2]]
            return "`".join(parts)

        def write(path, text, mode="w"):
            with open(path, mode, encoding="utf-8") as fh:
                fh.write(text)

        results = []
        try:
            for run in json.loads(read("brevio-gate.sarif") or "{}").get("runs", []):
                results += [r for r in run.get("results", []) if not r.get("suppressions")]
        except ValueError:
            print("::warning title=brevio-core::the SARIF file could not be read, so no annotations were written")
        for r in results[:CAP]:
            where = (r.get("locations") or [{}])[0].get("physicalLocation", {})
            path = where.get("artifactLocation", {}).get("uri", "")
            line = where.get("region", {}).get("startLine", 1)
            title = esc(f"brevio-core {r.get('ruleId', '')}".strip(), prop=True)
            print(f"::warning file={esc(path, prop=True)},line={line},title={title}::{esc(r.get('message', {}).get('text', ''))}")
        if len(results) > CAP:
            print(f"::notice title=brevio-core::{len(results) - CAP} more findings are listed in the job summary")

        report = read(os.path.join(tmp, "brevio-core.md")).strip()
        if env.get("NOTHING") == "true":
            report = "### brevio-core\n\nNothing to scan: this change adds no lines in the files the rules read."
        elif not report:
            report = f"### brevio-core\n\nThe scan stopped with exit code {env.get('RC') or '?'}; the job log says why."
        write(env["GITHUB_STEP_SUMMARY"], report + "\n", "a")

        footer = env.get("FOOTER", "auto")
        if footer == "true" or (footer == "auto" and env.get("PRIVATE") != "true"):
            repo = f"{env['GITHUB_SERVER_URL']}/Brevio-Ventures/brevio-core"
            tail = f"\n\n<sub>checked by [brevio-core]({repo})</sub>\n"
        else:
            tail = "\n"
        sha = env.get("GITHUB_SHA", "")[:12]
        write(os.path.join(tmp, "brevio-core-comment.md"), f"{MARKER}\n{quiet_mentions(report)}{tail}")
        write(os.path.join(tmp, "brevio-core-resolved.md"),
              f"{MARKER}\n### brevio-core\n\nResolved: no findings remain as of {sha}.{tail}")
        write(env["GITHUB_OUTPUT"], f"findings={len(results)}\n", "a")
    - name: brevio-core / pull request comment
      if: inputs.comment != 'never' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_ENTERPRISE_TOKEN: ${{ github.token }}
        MODE: ${{ inputs.comment }}
        RC: ${{ steps.scan.outputs.rc }}
        FINDINGS: ${{ steps.report.outputs.findings }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        # A comment that cannot be written never fails the check: the job summary holds the same report.
        note() { printf '\n> %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; echo "::notice title=brevio-core::$1"; }
        if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          note "No pull request comment: this pull request comes from a fork, so its token is read-only. The report is in this summary."
          exit 0
        fi
        export GH_HOST="${GITHUB_SERVER_URL#*://}"
        api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
        err="$RUNNER_TEMP/brevio-core-gh.err"
        failed() {
          if grep -q 'HTTP 403' "$err"; then
            note "No pull request comment: the token may not write to this pull request (HTTP 403). Give the job pull-requests: write. The report is in this summary."
          else
            note "No pull request comment: the GitHub API call failed ($(head -n 1 "$err")). The report is in this summary."
          fi
          exit 0
        }
        existing=$(gh api --paginate "$api/issues/$PR_NUMBER/comments" \
          --jq '.[] | select(.body | startswith("<!-- brevio-core -->")) | .id' 2> "$err") || failed
        existing=$(printf '%s\n' "$existing" | head -n 1)
        if [ "${FINDINGS:-0}" -gt 0 ] || [ "$MODE" = "always" ]; then
          body="$RUNNER_TEMP/brevio-core-comment.md"
        elif [ -n "$existing" ] && [ "$RC" = "0" ]; then
          body="$RUNNER_TEMP/brevio-core-resolved.md"      # a clean run edits the old comment, it never posts a new one
        else
          exit 0
        fi
        if [ -n "$existing" ]; then
          gh api --silent --method PATCH "$api/issues/comments/$existing" -F "body=@$body" 2> "$err" || failed
        else
          gh api --silent --method POST "$api/issues/$PR_NUMBER/comments" -F "body=@$body" 2> "$err" || failed
        fi
    - name: brevio-core / upload SARIF
      if: inputs.sarif == 'true'
      # A repository without code scanning (a private one without it) rejects the upload; the check must not fail on that.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: brevio-gate.sarif
        category: brevio-core
    - name: brevio-core / result
      id: result
      shell: bash
      env:
        RC: ${{ steps.scan.outputs.rc }}
        WANT_SARIF: ${{ inputs.sarif }}
      run: |
        if [ "$WANT_SARIF" != "true" ]; then rm -f brevio-gate.sarif; fi
        if [ "$RC" -eq 0 ]; then echo "status=pass" >> "$GITHUB_OUTPUT"; else echo "status=fail" >> "$GITHUB_OUTPUT"; fi
        exit "$RC"
